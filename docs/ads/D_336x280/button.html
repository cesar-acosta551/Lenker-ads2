<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="ad.size" content="width=336,height=280">
<title>Lenker D 336x280 button</title>
<script>var clickTag = "https://lenker.com";</script>
<style>
@font-face{font-family:'Inter';font-weight:100 900;font-style:normal;src:url('../../assets/Inter.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:336px;height:280px;overflow:hidden;background:#26445A;font-family:'Inter',-apple-system,Helvetica,Arial,sans-serif}
@keyframes adIn{0%{opacity:0;transform:translateY(.45em)}7%{opacity:1;transform:none}90%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}@keyframes adPop{0%{opacity:0;transform:scale(.85)}5%{opacity:1;transform:scale(1.04)}7%{transform:scale(1)}40%{transform:scale(1)}43%{transform:scale(1.06)}46%{transform:scale(1)}90%{opacity:1}96%,100%{opacity:0}}@keyframes adBg{0%{transform:scale(1.1)}92%{transform:scale(1)}100%{transform:scale(1.1)}}
.ad{position:relative;width:336px;height:280px;overflow:hidden;background:#26445A;cursor:pointer}
.bg{position:absolute;inset:0;background:url('bg.jpg') center/cover no-repeat;transform-origin:60% 40%;animation:adBg 9s ease-out 0s infinite both}
.scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(16,32,46,.6) 0%,rgba(16,32,46,0) 24%),linear-gradient(to top,rgba(30,55,75,.94) 0%,rgba(34,60,82,.86) 38%,rgba(38,68,90,0) 78%)}
.ui{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-size:14px;font-weight:800;letter-spacing:.2em;color:#F4F1EA;animation:adIn 9s cubic-bezier(.2,.7,.2,1) .1s infinite both}
.stack{display:flex;flex-direction:column;gap:12px;}
.copy{display:flex;flex-direction:column;gap:6px}
.hl{font-size:23px;line-height:1.15;font-weight:700;letter-spacing:-.01em;color:#F4F1EA;text-wrap:balance}
.w{display:inline-block;animation:adIn 9s cubic-bezier(.2,.7,.2,1) 0s infinite both}
.a{color:#D4E84A}
.sub{font-size:16px;line-height:1.3;color:#C3D1DC;text-wrap:balance;animation:adIn 9s cubic-bezier(.2,.7,.2,1) 1.35s infinite both}
.cta{align-self:flex-start;font-size:14px;font-weight:700;transform-origin:left center;background:#D4E84A;color:#1E3747;padding:7px 14px;border-radius:4px;animation:adPop 9s cubic-bezier(.2,.7,.2,1) 1.80s infinite both}
</style></head>
<body>
<div class="ad" id="ad" onclick="window.open(window.clickTag,'_blank')">
  <div class="bg"></div><div class="scrim"></div>
  <div class="ui">
    <div class="logo">LENKER</div>
    <div class="stack">
      <div class="copy"><div class="hl"><span class="w" style="animation-delay:0.40s">No</span> <span class="w a" style="animation-delay:0.49s">wasted</span> <span class="w" style="animation-delay:0.58s">impressions.</span></div><div class="sub">Not on you. Not on your customers.</div></div>
      <div class="cta">See how</div>
    </div>
  </div>
</div>
</body></html>
